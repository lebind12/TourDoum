# infra/observability/docker-compose.yml
# ADR-0013 사전 인프라 — 로컬 관측 스택 (Prometheus + Grafana + Loki + Promtail).
#
# 가동:
#   docker compose -f infra/observability/docker-compose.yml up -d
# 검증:
#   curl localhost:9090/-/ready    # prometheus
#   curl localhost:3000/api/health # grafana
#   curl localhost:3100/ready      # loki
# 종료:
#   docker compose -f infra/observability/docker-compose.yml down
#
# Spring Boot Actuator 노출:
#   backend application.yml의 management.endpoints.web.exposure.include 에 prometheus 포함.
#   scrape target = host.docker.internal:30080/actuator/prometheus (agent worktree 포트 분리).
#
# Linux 사용자: macOS/Win과 달리 host.docker.internal 자동 매핑이 없으므로 extra_hosts 필요(아래 박제).

name: tourdoum-observability

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: tourdoum-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - obs

  grafana:
    image: grafana/grafana:11.3.1
    container_name: tourdoum-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_LOG_LEVEL: warn
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    networks:
      - obs

  loki:
    image: grafana/loki:3.2.1
    container_name: tourdoum-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - obs

  promtail:
    image: grafana/promtail:3.2.1
    container_name: tourdoum-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/tmp
    depends_on:
      - loki
    networks:
      - obs

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  promtail-positions:

networks:
  obs:
    driver: bridge
