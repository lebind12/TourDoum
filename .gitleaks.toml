[extend]
useDefault = true

[[rules]]
id = "openai-key"
description = "OpenAI API key"
regex = '''sk-[A-Za-z0-9]{20,}'''
tags = ["key", "openai"]

[[rules]]
id = "anthropic-key"
description = "Anthropic API key"
regex = '''sk-ant-[A-Za-z0-9_-]{20,}'''
tags = ["key", "anthropic"]

[allowlist]
description = "false positives"
paths = [
  '''(?i).*\.env\.example$''',
  '''(?i).*/fixtures/.*''',
  '''(?i).*/testdata/.*''',
]
