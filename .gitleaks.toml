[extend]
useDefault = true

[[rules]]
id = "openai-key"
description = "OpenAI API key"
regex = '''sk-[A-Za-z0-9]{20,}'''
tags = ["key", "openai"]

[[rules]]
id = "anthropic-key"
description = "Anthropic API key"
regex = '''sk-ant-[A-Za-z0-9_-]{20,}'''
tags = ["key", "anthropic"]

[allowlist]
description = "false positives"
paths = [
  '''(?i).*\.env\.example$''',
  # ADR-0013 사전 인프라 (TaskList #10) — infra/aws 자격 증명 템플릿/문서.
  # AWS placeholder(AKIAIOSFODNN7EXAMPLE 등)는 AWS 공식 docs example 값.
  '''(?i)^infra/aws/\.env\.aws\.example$''',
  '''(?i)^infra/aws/README\.md$''',
  '''(?i).*/fixtures/.*''',
  '''(?i).*/testdata/.*''',
  '''(?i)docs/screenshots/.*\.json$''',
  '''(?i).*idempotency-trace\.json$''',
  # JWT dev keypair (#61, ADR-0011 BE-1) — classpath dev RSA keypair.
  # 운영 키 절대 금지: BE-2에서 환경변수 외부화 시 본 파일들 제거.
  '''(?i)backend/src/main/resources/keys/jwt-dev-private\.pem$''',
  '''(?i)backend/src/main/resources/keys/jwt-dev-public\.pem$''',
]
regexes = [
  '''idempotencyKey":\s*"[a-f0-9-]{36}"''',
]
