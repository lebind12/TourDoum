repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        # 8MB로 상향 — TourAPI 같은 데이터 스냅샷 마이그레이션(V4__tour_api_attractions.sql ~5.5MB)이
        # 정상 케이스. 실수로 큰 파일 들어오는 것 막는 용도가 본래 목적이라 8MB로도 충분.
        args: ["--maxkb=8192"]
      - id: check-merge-conflict
      - id: detect-private-key
        # JWT dev keypair 예외 (#61, ADR-0011 BE-1). 운영 키 절대 금지 — BE-2에서 외부화 시 본 항목 제거.
        exclude: '^backend/src/main/resources/keys/jwt-dev-(private|public)\.pem$'

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/biomejs/pre-commit
    rev: v0.5.0
    hooks:
      - id: biome-check
        # frontend/package.json의 ^1.9.0과 정합 (이전 1.8.3 → 무한 fix 루프 발생)
        additional_dependencies: ["@biomejs/biome@1.9.4"]

  - repo: local
    hooks:
      - id: conventional-commit-msg
        name: conventional commit message
        entry: .harness-hooks/check-commit-msg.sh
        language: script
        stages: [commit-msg]
