# 테스트 전용 설정 — 단위/슬라이스/스모크 테스트에서 사용
spring:
  datasource:
    # @SpringBootTest 컨텍스트 스모크는 H2 인메모리로 실행 (Docker 의존 X)
    url: jdbc:h2:mem:tourdoum_test;MODE=MYSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  data:
    redis:
      host: localhost
      port: 6379

  session:
    store-type: none  # 슬라이스/스모크 테스트에서 Redis 불필요
