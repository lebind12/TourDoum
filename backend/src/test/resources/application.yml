# 테스트 전용 설정 — 단위/슬라이스 테스트에서 사용
spring:
  jpa:
    # H2 인메모리 DB 사용 시 방언 자동 감지
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  data:
    redis:
      host: localhost
      port: 6379

  session:
    store-type: none  # 슬라이스 테스트에서 Redis 불필요
