# 테스트 전용 설정 — 단위/슬라이스/스모크 테스트에서 사용
spring:
  datasource:
    # @SpringBootTest 컨텍스트 스모크는 H2 인메모리로 실행 (Docker 의존 X)
    url: jdbc:h2:mem:tourdoum_test;MODE=MYSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  # Flyway 비활성 (ADR-0004): 슬라이스/스모크 테스트는 H2 + ddl-auto=create-drop로 스키마 관리.
  # MySQL 전용 DDL(V1__init.sql)이 H2와 충돌하는 것을 방지한다.
  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

# Spring Session 폐기 (ADR-0011, #61) — 본 yml에서도 spring.session.* 제거.
# JWT 설정은 main application.yml의 기본값을 그대로 상속(classpath의 jwt-dev-*.pem 사용).
tourdoum:
  jwt:
    issuer: tourdoum
    access-ttl: 15m
    refresh-ttl: 14d
    active-kid: dev-1
    private-key-location: classpath:keys/jwt-dev-private.pem
    public-key-location: classpath:keys/jwt-dev-public.pem
