server:
  port: 8080

spring:
  application:
    name: tourdoum-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tourdoum?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USER:tourdoum}
    password: ${DB_PASSWORD:tourdoum}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    # ADR-0004(2026-05-06 Accepted): Flyway가 스키마를 관리하므로 ddl-auto=validate로 전환.
    # 참고: docs/adr/0004-db-migration.md
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  # Flyway 마이그레이션 설정 (ADR-0004)
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      # docker-compose host 매핑이 6380:6379 (다른 프로젝트의 redis와 호스트 포트 충돌 회피).
      # 환경변수로 오버라이드 가능. .env 파일은 Spring Boot가 자동 로드하지 않음 — shell env 또는 IDE run config에서 주입.
      port: ${REDIS_PORT:6380}

  session:
    store-type: redis
    timeout: 30m
    redis:
      namespace: tourdoum:session
      flush-mode: on_save

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# ADR-0005: 한국관광공사 TourAPI 4.0 (KorService2) 설정
# serviceKey는 TOUR_API_KEY 환경변수로 주입. 코드·로그·Git에 키 값 노출 금지.
# ETL 실행: scripts/etl-tour-api.sh (Spring 컨텍스트 미기동, DB 연결 불필요)
tourapi:
  base-url: https://apis.data.go.kr/B551011/KorService2
  service-key: ${TOUR_API_KEY:}
  mobile-app: tourdoum
  page-size: 100
  area-codes: [1, 2, 3, 4, 5, 6, 7, 8, 31, 32, 33, 34, 35, 36, 37, 38, 39]
  content-type-ids: [12, 14, 28]
