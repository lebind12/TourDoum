server:
  port: 8080

spring:
  application:
    name: tourdoum-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tourdoum?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USER:tourdoum}
    password: ${DB_PASSWORD:tourdoum}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    # ADR-0004(2026-05-06 Accepted): Flyway가 스키마를 관리하므로 ddl-auto=validate로 전환.
    # 참고: docs/adr/0004-db-migration.md
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  # Flyway 마이그레이션 설정 (ADR-0004)
  flyway:
    enabled: true
    baseline-on-migrate: true
    # 학습/dev 단계: 체크섬 불일치를 자동 repair → 부팅 차단 회피.
    # 운영 전환 시 false로 되돌릴 것 — 의도치 않은 V{n} 변경이 감춰질 위험.
    repair-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      # docker-compose host 매핑이 6380:6379 (다른 프로젝트의 redis와 호스트 포트 충돌 회피).
      # 환경변수로 오버라이드 가능. .env 파일은 Spring Boot가 자동 로드하지 않음 — shell env 또는 IDE run config에서 주입.
      port: ${REDIS_PORT:6380}

  # Spring Session 폐기 — ADR-0011 (BE-1 #61). starter-data-redis는 BE-2 family/denylist용으로 유지.

# JWT 설정 (ADR-0011 BE-1 #61)
tourdoum:
  jwt:
    issuer: tourdoum
    access-ttl: 15m
    active-kid: dev-1
    private-key-location: classpath:keys/jwt-dev-private.pem
    public-key-location: classpath:keys/jwt-dev-public.pem
    # previous-kid / previous-public-key-location은 BE-2 key rotation 도입 시 활성화.

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# Swagger / OpenAPI 설정 (ADR-0008)
# prod 전환 시 springdoc.swagger-ui.enabled=false 로 비활성화.
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    csrf:
      enabled: false  # dev 한정 (CSRF 비활성 상태와 정합)
  api-docs:
    path: /v3/api-docs
