server:
  port: 8080

spring:
  application:
    name: tourdoum-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tourdoum?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USER:tourdoum}
    password: ${DB_PASSWORD:tourdoum}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    # ADR-0004(2026-05-06 Accepted): Flyway가 스키마를 관리하므로 ddl-auto=validate로 전환.
    # 참고: docs/adr/0004-db-migration.md
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  # Flyway 마이그레이션 설정 (ADR-0004)
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      # docker-compose host 매핑이 6380:6379 (다른 프로젝트의 redis와 호스트 포트 충돌 회피).
      # 환경변수로 오버라이드 가능. .env 파일은 Spring Boot가 자동 로드하지 않음 — shell env 또는 IDE run config에서 주입.
      port: ${REDIS_PORT:6380}

  session:
    store-type: redis
    timeout: 30m
    redis:
      namespace: tourdoum:session
      flush-mode: on_save

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
